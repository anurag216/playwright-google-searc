name: XAUUSD Research Data Artifact

on:
  push:
    paths:
      - '.github/workflows/xauusd-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-data:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors \
            -o XAUUSD_Dukascopy_M1_2018-01-01_2026-08-14.csv.gz \
            https://github.com/anurag216/playwright-google-searc/releases/download/xauusd-data-v1/XAUUSD_Dukascopy_M1_2018-01-01_2026-08-14.csv.gz
          curl -L --fail --retry 5 --retry-all-errors \
            -o XAUUSD_Dukascopy_M1_2018-01-01_2026-08-14_manifest.json \
            https://github.com/anurag216/playwright-google-searc/releases/download/xauusd-data-v1/XAUUSD_Dukascopy_M1_2018-01-01_2026-08-14_manifest.json
          sha256sum XAUUSD_Dukascopy_M1_2018-01-01_2026-08-14.csv.gz

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-data-v1
          path: |
            XAUUSD_Dukascopy_M1_2018-01-01_2026-08-14.csv.gz
            XAUUSD_Dukascopy_M1_2018-01-01_2026-08-14_manifest.json
          compression-level: 0
          retention-days: 1
