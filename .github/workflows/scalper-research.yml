name: Validate Session Survivors 2022

on:
  push:
    branches:
      - scalper-research-lab
    paths:
      - "candidate_validation/validate_session_survivors_2022.py"
      - ".github/workflows/scalper-research.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate frozen session survivors on untouched 2022
        run: python candidate_validation/validate_session_survivors_2022.py
      - name: Upload validation
        uses: actions/upload-artifact@v4
        with:
          name: scalper-session-survivors-2022
          path: |
            session_2022_output/validation_2022.json
            session_2022_output/summary.md
