name: Session Structure Scalper Search

on:
  push:
    branches:
      - scalper-research-lab
    paths:
      - "session_structure/**"
      - ".github/workflows/scalper-research.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run session-structure search
        run: python session_structure/session_search.py
      - name: Upload session results
        uses: actions/upload-artifact@v4
        with:
          name: scalper-session-results
          path: |
            session_output/session_results.json
            session_output/summary.md
