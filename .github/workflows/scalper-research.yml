name: Validate Stronger Scalper Survivors

on:
  push:
    branches:
      - scalper-research-lab
    paths:
      - "candidate_validation/validate_v2_survivors_2025.py"
      - ".github/workflows/scalper-research.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate stronger frozen survivors on 2025
        run: python candidate_validation/validate_v2_survivors_2025.py
      - name: Upload validation
        uses: actions/upload-artifact@v4
        with:
          name: scalper-v2-survivors-2025
          path: |
            v2_survivor_2025/validation.json
            v2_survivor_2025/summary.md
