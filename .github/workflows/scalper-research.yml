name: Regime Adaptive Scalper Search

on:
  push:
    branches:
      - scalper-research-lab
    paths:
      - "regime_research/**"
      - ".github/workflows/scalper-research.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run regime-adaptive search
        run: python regime_research/regime_gate_search.py
      - name: Upload regime results
        uses: actions/upload-artifact@v4
        with:
          name: scalper-regime-results
          path: |
            regime_output/regime_results.json
            regime_output/summary.md
