name: London-NY Retest Regime Filter Search

on:
  push:
    branches:
      - scalper-research-lab
    paths:
      - "session_structure/filter_search.py"
      - ".github/workflows/scalper-research.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Search regime filters
        run: python session_structure/filter_search.py
      - name: Upload filter results
        uses: actions/upload-artifact@v4
        with:
          name: scalper-session-filter-results
          path: |
            session_filter_output/filter_results.json
            session_filter_output/summary.md
