name: Scalper Research Walkforward

on:
  push:
    branches:
      - scalper-research-lab
    paths:
      - "fast_research/**"
      - ".github/workflows/scalper-research.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run compact profit-focused search
        run: python fast_research/research_fast_profit.py
      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: scalper-fast-profit-results
          path: |
            fast_output/fast_results.json
            fast_output/fast_summary.md
