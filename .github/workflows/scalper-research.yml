name: Scalper Candidate Validation

on:
  push:
    branches:
      - scalper-research-lab
    paths:
      - "candidate_validation/**"
      - ".github/workflows/scalper-research.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate frozen candidate on 2025
        run: python candidate_validation/validate_2025.py
      - name: Upload candidate validation
        uses: actions/upload-artifact@v4
        with:
          name: scalper-candidate-2025-validation
          path: |
            candidate_2025_output/candidate_2025.json
            candidate_2025_output/candidate_2025_summary.md
